# QA service, pipeline v3: one container, no database. Guide: Docs/DOCKER.md
#   docker compose -f docker-compose.v3.yml up -d --build
# Needs the weights in ./models/final-softce-3 (they are not in git or in the image).
services:
  qa-v3:
    build:
      context: .
      dockerfile: Dockerfile.v3
    image: qa-v3:latest
    container_name: qa_v3
    ports:
      - "8006:8006"
    # Optional settings (QA_API_KEY, CORS_ORIGINS, QUEUE_MAX ...) can go in a .env file next to this one; it is not required.
    env_file:
      - path: .env
        required: false
    # These win over .env, so a leftover v2 setting there cannot switch the flow or the model
    environment:
      LAYA_FLOW: v3
      LAYA_CHECKPOINT: models/final-softce-3
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./models:/app/models:ro
      - qa_v3_logs:/app/logs
    mem_limit: 4g              # measured peak with a 1,500-turn call: about 2.7 GB
    restart: unless-stopped

volumes:
  qa_v3_logs:
