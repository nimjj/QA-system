version: '3.8'

services:
  qa-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: qa-service:latest
    container_name: qa_service
    ports:
      - "8006:8006"
    networks:
      - ciap-qa-network
    env_file:
      - path: .env
        required: false
    environment:
      - LAYA_FLOW=v3
      - LAYA_CHECKPOINT=
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped

networks:
  ciap-qa-network:
    name: ciap-qa-network
    driver: bridge
