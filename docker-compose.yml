version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: qa_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  qa-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa_service
    ports:
      - "8006:8006"
    depends_on:
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_HOST=http://qa_ollama:11434
      - LLM_MODEL=llama3.1
      - EMBED_MODEL=nomic-embed-text
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=callIntelligence
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
    volumes:
      - ./logs:/app/logs
      - ./inputs:/app/inputs
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: qa_gateway
    ports:
      - "8005:8005"
    depends_on:
      - qa-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - APP_URL=http://qa-service:8006
      - GATEWAY_PORT=8005
      - GATEWAY_HOST=0.0.0.0
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=callIntelligence
      - DB_USER=postgres
      - DB_PASSWORD=mysecretpassword
    restart: unless-stopped

volumes:
  ollama_data:
