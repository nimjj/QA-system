version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: qa_ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_cache:/root/.ollama
    restart: unless-stopped

  qa-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qa_service
    ports:
      - "8006:8006"
    depends_on:
      - ollama
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - OLLAMA_HOST=http://qa_ollama:11434
    volumes:
      - ./logs:/app/logs
      - ./inputs:/app/inputs
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: qa_gateway
    ports:
      - "8005:8005"
    depends_on:
      - qa-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - APP_URL=http://qa_service:8006
    restart: unless-stopped
